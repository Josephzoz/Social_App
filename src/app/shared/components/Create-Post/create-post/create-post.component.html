<section class="bg-white rounded-2xl border border-slate-200/80 p-4 sm:p-5 shadow-xs mb-4">
  <form #CreateForm (submit)="createPost($event, CreateForm)">
   
    <div class="flex items-center gap-3">
      <img
        [src]="userInfo?.photo"
        [alt]="userInfo?.name "
        class="w-11 h-11 rounded-full object-cover shrink-0 border border-slate-100"
      />

      <div class="flex flex-col items-start gap-1">
        <h2 class="text-sm sm:text-base font-bold text-slate-900 leading-tight">
          {{ userInfo?.name}}
        </h2>

      
        <label
          for="privacy-select"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 bg-slate-100 hover:bg-slate-200/80 rounded-full text-xs font-semibold text-slate-700 transition-colors cursor-pointer select-none border border-slate-200/60 shadow-2xs"
        >
          @switch (postPrivacy.value) {
            @case ('following') {
              <i class="fa-solid fa-user-group text-[11px] text-slate-600 shrink-0"></i>
            }
            @case ('only_me') {
              <i class="fa-solid fa-lock text-[11px] text-slate-600 shrink-0"></i>
            }
            @default {
              <i class="fa-solid fa-earth-americas text-[11px] text-slate-600 shrink-0"></i>
            }
          }

          <div class="relative flex items-center">
            <select
              [formControl]="postPrivacy"
              id="privacy-select"
              name="Privacy-settings"
              class="bg-transparent !bg-none [background-image:none]! border-0 p-0 pr-3.5 text-xs font-semibold text-slate-700 cursor-pointer focus:ring-0 focus:outline-none appearance-none capitalize"
            >
              <option value="public" class="bg-white text-slate-800 py-1.5 font-medium">Public</option>
              <option value="following" class="bg-white text-slate-800 py-1.5 font-medium">Followers</option>
              <option value="only_me" class="bg-white text-slate-800 py-1.5 font-medium">Only Me</option>
            </select>

            <i class="fa-solid fa-chevron-down text-[9px] text-slate-500 pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 shrink-0"></i>
          </div>
        </label>
      </div>
    </div>

    
    <div class="mt-3.5">
      <textarea
        [formControl]="postBody"
        name="post-content"
        id="post-content"
        rows="4"
        placeholder="What's on your mind, Joseph?"
        class="w-full min-h-[135px] p-4 text-base text-slate-800 placeholder:text-slate-400 bg-white border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-blue-500/15 focus:border-blue-400 transition-all resize-y"
      ></textarea>
    </div>

    
    @if (imgUrl()) {
      <div class="relative mt-3 rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 max-h-80 flex items-center justify-center">
        <img [src]="imgUrl()" alt="Post preview" class="w-full max-h-80 object-contain rounded-xl" />
      </div>
    }

  
    <div class="border-t border-slate-200/80 my-3.5"></div>

    
    <div class="flex flex-wrap items-center justify-between gap-3">
      
      <div class="flex items-center gap-1 sm:gap-2">
        
        <label
          for="file"
          class="inline-flex items-center gap-2 px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors cursor-pointer select-none"
        >
          <i class="fa-regular fa-image text-emerald-500 text-lg shrink-0"></i>
          <span class="text-sm font-semibold">Photo/video</span>
        </label>
        <input (change)="holdImage($event)" id="file" class="hidden" type="file" accept="image/*" />

        
        <button
          type="button"
          class="inline-flex items-center gap-2 px-2.5 sm:px-3 py-1.5 sm:py-2 rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition-colors cursor-pointer select-none"
        >
          <i class="fa-regular fa-face-smile text-amber-500 text-lg shrink-0"></i>
          <span class="text-sm font-semibold">Feeling/activity</span>
        </button>
      </div>

     
      <div>
        <button
          type="submit"
          class="inline-flex items-center justify-center gap-2 px-6 py-2 bg-[#5b96f7] hover:bg-[#4a85eb] active:scale-95 text-white text-sm sm:text-base font-semibold rounded-xl shadow-xs hover:shadow transition-all duration-150 cursor-pointer select-none"
        >
          <span>Post</span>
          <i class="fa-solid fa-paper-plane text-white text-sm shrink-0"></i>
        </button>
      </div>
    </div>
  </form>
</section>
