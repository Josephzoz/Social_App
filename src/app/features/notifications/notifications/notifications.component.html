<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
 
  <div class="bg-white rounded-2xl border border-slate-200/80 shadow-xs p-6 sm:p-8">

    <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Notifications</h1>
        <p class="text-sm text-slate-500 mt-1">Realtime updates for likes, comments, shares, and follows.</p>
      </div>

      
      <button
        type="button"
        class="self-start sm:self-auto inline-flex items-center gap-2 px-3.5 py-1.5 sm:px-4 sm:py-2 text-sm font-medium text-slate-700 bg-white border border-slate-200/90 rounded-xl hover:bg-slate-50 hover:border-slate-300 transition-all duration-200 shadow-2xs cursor-pointer select-none"
      >
        <i class="fa-solid fa-check-double text-slate-400 text-sm shrink-0"></i>
        <span>Mark all as read</span>
      </button>
    </div>

   
    <div class="flex items-center gap-2 mt-5 sm:mt-6">
      <button
        type="button"
        class="px-4 py-1.5 rounded-full text-sm font-medium bg-blue-600 hover:bg-blue-700 text-white shadow-xs transition-colors duration-200 cursor-pointer select-none"
      >
        All
      </button>

      <button
        type="button"
        class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-100 hover:bg-slate-200 text-slate-700 transition-colors duration-200 cursor-pointer select-none"
      >
        Unread
      </button>
    </div>

  
    <div
      class="mt-6 border border-slate-200/80 rounded-2xl bg-slate-50/50 py-16 sm:py-20 px-4 flex items-center justify-center text-center"
    >
      <p class="text-slate-500 text-sm font-normal">No notifications yet.</p>
    </div>

  </div>
</main>
