

<div class="space-y-4">
  @if(posts().length > 0) {
    @for(post of posts(); track post._id) {
      <app-posts [post]="post"></app-posts>
    }
  } @else {
    <div class="bg-white rounded-2xl border border-slate-200/80 p-12 text-center shadow-xs">
      <div class="w-14 h-14 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto mb-3">
        <i class="fa-solid fa-globe text-2xl"></i>
      </div>
      <h3 class="text-base font-bold text-slate-800">No saved posts yet</h3>
      <p class="text-sm text-slate-500 mt-1">Be the first to save posts</p>
    </div>
  }
</div>
