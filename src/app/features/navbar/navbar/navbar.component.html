<nav class="bg-white border-b border-slate-200/80 sticky top-0 z-40 w-full shadow-xs">
  <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 h-16 flex items-center justify-between">

    <!-- Left: Brand Logo & Title -->
    <a routerLink="/feed" class="flex items-center gap-3 select-none">
      <img src="./Images/route.png" alt="Route logo"
        class="w-9 h-9 sm:w-8 sm:h-8 rounded-xl object-contain shadow-xs" />
      <span class="hidden sm:inline text-xl font-bold text-slate-900 tracking-tight">Route Posts</span>
    </a>

    <!-- Center: Navigation Pill Bar -->
    <div class="flex items-center bg-[#f0f4f9] border border-slate-200/80 rounded-2xl p-1 gap-1">
      <!-- Feed Link -->
      <a routerLink="/feed" routerLinkActive="bg-white !text-blue-600 shadow-xs border-slate-200/70 font-semibold"
        class="px-3.5 py-1.5 sm:px-4 sm:py-1.5 rounded-xl flex items-center justify-center gap-2 text-sm border border-transparent font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all duration-200">
        <i class="fa-regular fa-house text-lg sm:text-base"></i>
        <span class="hidden md:inline">Feed</span>
      </a>

      <!-- Profile Link -->
      <a routerLink="/profile" routerLinkActive="bg-white !text-blue-600 shadow-xs border-slate-200/70 font-semibold"
        class="px-3.5 py-1.5 sm:px-4 sm:py-1.5 rounded-xl flex items-center justify-center gap-2 text-sm border border-transparent font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all duration-200">
        <i class="fa-regular fa-user text-lg sm:text-base"></i>
        <span class="hidden md:inline">Profile</span>
      </a>

      <!-- Notifications Link -->
      <a routerLink="/notifications"
        routerLinkActive="bg-white !text-blue-600 shadow-xs border-slate-200/70 font-semibold"
        class="px-3.5 py-1.5 sm:px-4 sm:py-1.5 rounded-xl flex items-center justify-center gap-2 text-sm border border-transparent font-medium text-slate-600 hover:text-slate-900 hover:bg-white/60 transition-all duration-200">
        <span class="relative flex items-center justify-center">
          <i class="fa-regular fa-comment text-lg sm:text-base"></i>

        </span>
        <span class="hidden md:inline">Notifications</span>
      </a>
    </div>

    <!-- Right: User Menu Capsule & Dropdown -->
    <div class="relative flex items-center">
      <!-- Trigger Pill Button -->
      <button type="button" id="user-menu-button" aria-expanded="false" data-dropdown-toggle="user-dropdown"
        data-dropdown-placement="bottom-end" data-dropdown-offset-distance="10"
        class="flex items-center gap-2 sm:gap-2.5 p-1 pr-2.5 sm:px-3 sm:py-1.5 bg-[#f0f4f9] sm:bg-white hover:bg-slate-100 sm:hover:bg-slate-50 border border-slate-200/90 rounded-full transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-blue-500/20 select-none">
        <img [src]="userInfo?.photo || './Images/default-profile.png'" alt="User photo"
          class="w-8 h-8 rounded-full object-cover shrink-0" />
        <span class="hidden md:inline text-sm font-medium text-slate-800 whitespace-nowrap">
          {{ userInfo?.name || 'Joseph Ashraf' }}
        </span>
        <i class="fa-solid fa-bars text-slate-500 text-sm shrink-0"></i>
      </button>

      <!-- Dropdown Menu Card -->
      <div id="user-dropdown"
        class="z-50 hidden bg-white rounded-2xl shadow-xl border border-slate-100 p-2 min-w-[200px] w-56">
        <div class="px-3.5 py-2.5 border-b border-slate-100 mb-1">
          <p class="text-sm font-semibold text-slate-900 truncate">
            {{ userInfo?.name || 'Joseph Ashraf' }}
          </p>
          <p class="text-xs text-slate-500 truncate">
            {{ userInfo?.email || 'user@example.com' }}
          </p>
        </div>
        <ul class="space-y-0.5 text-sm" aria-labelledby="user-menu-button">
          <li>
            <a routerLink="/profile"
              class="flex items-center gap-3 px-3.5 py-2.5 text-sm font-medium text-slate-700 hover:text-slate-900 hover:bg-slate-50 rounded-xl transition-colors cursor-pointer">
              <i class="fa-regular fa-user text-slate-600 w-4 text-center shrink-0"></i>
              <span>Profile</span>
            </a>
          </li>
          <li>
            <a routerLink="/settings"
              class="flex items-center gap-3 px-3.5 py-2.5 text-sm font-medium text-slate-700 hover:text-slate-900 hover:bg-slate-50 rounded-xl transition-colors cursor-pointer">
              <i class="fa-solid fa-gear text-slate-600 w-4 text-center shrink-0"></i>
              <span>Settings</span>
            </a>
          </li>
          <li class="py-1">
            <div class="border-t border-slate-100"></div>
          </li>
          <li>
            <button (click)="logOut()" type="button"
              class="w-full text-left px-3.5 py-2.5 text-sm font-medium text-rose-500 hover:text-rose-600 hover:bg-rose-50/70 rounded-xl transition-colors cursor-pointer">
              Logout
            </button>
          </li>
        </ul>
      </div>
    </div>

  </div>
</nav>
